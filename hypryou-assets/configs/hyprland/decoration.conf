
decoration {
    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.05
        contrast = 1.1
        brightness = 1.0
        vibrancy_darkness = 0.5
        vibrancy = 0.2
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(0, 0, 0, 0.7)
        offset = 0, 2
    }

    active_opacity = 1
    inactive_opacity = 1
    fullscreen_opacity = 1
}
