# ######## Window rules ########
windowrule = tile, class:^(Microsoft-edge)$
windowrule = tile, class:^(Brave-browser)$
windowrule = tile, class:^(Chromium)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(blueberry.py)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(qalculate-gtk)$
windowrule = float, class:^(steam)$
windowrule = float, class:^(com.koeqaife.hypryou)$
windowrule = stayfocused, title:^()$, class:^(steam)$
windowrule = minsize 1 1, title:^()$, class:^(steam)$
windowrule = float, title:^(Volume Control)(.*)$

# Fix wdisplays (Displays app) - force floating et taille raisonnable
windowrulev2 = float, class:^(wdisplays)$
windowrulev2 = size 900 600, class:^(wdisplays)$
windowrulev2 = center, class:^(wdisplays)$
windowrulev2 = stayfocused, class:^(wdisplays)$

# VSCode - Enable blur for transparent background
windowrulev2 = opacity 0.95 0.85, class:^(code-url-handler)$
windowrulev2 = opacity 0.95 0.85, class:^(Code)$
windowrulev2 = opacity 0.95 0.85, class:^(code)$
windowrulev2 = opacity 0.95 0.85, class:^(VSCodium)$

# Terminals - Enable blur for transparent background
windowrulev2 = opacity 0.95 0.85, class:^(Alacritty)$
windowrulev2 = opacity 0.95 0.85, class:^(kitty)$
windowrulev2 = opacity 0.95 0.85, class:^(org.wezfurlong.wezterm)$
windowrulev2 = opacity 0.95 0.85, class:^(foot)$
windowrulev2 = opacity 0.95 0.85, class:^(gnome-terminal-server)$

# File Managers - Enable blur
windowrulev2 = opacity 0.95 0.85, class:^(org.gnome.Nautilus)$
windowrulev2 = opacity 0.95 0.85, class:^(thunar)$
windowrulev2 = opacity 0.95 0.85, class:^(nemo)$
windowrulev2 = opacity 0.95 0.85, class:^(dolphin)$
windowrulev2 = opacity 0.95 0.85, class:^(pcmanfm)$

# Development Tools - Enable blur
windowrulev2 = opacity 0.95 0.85, class:^(GitHub Desktop)$
windowrulev2 = opacity 0.95 0.85, class:^(GitKraken)$
windowrulev2 = opacity 0.95 0.85, class:^(jetbrains-.*)$

# System Tools - Enable blur
windowrulev2 = opacity 0.95 0.85, class:^(gnome-system-monitor)$
windowrulev2 = opacity 0.95 0.85, class:^(org.gnome.SystemMonitor)$
windowrulev2 = opacity 0.95 0.85, class:^(btop)$
windowrulev2 = opacity 0.95 0.85, class:^(htop)$
windowrulev2 = opacity 0.95 0.85, class:^(Pamac-manager)$

# Text Editors - Enable blur
windowrulev2 = opacity 0.95 0.85, class:^(gedit)$
windowrulev2 = opacity 0.95 0.85, class:^(org.gnome.TextEditor)$
windowrulev2 = opacity 0.95 0.85, class:^(mousepad)$
windowrulev2 = opacity 0.95 0.85, class:^(nvim-qt)$

# Media - Enable blur
windowrulev2 = opacity 0.95 0.85, class:^(Spotify)$
windowrulev2 = opacity 0.95 0.85, class:^(spotify)$
windowrulev2 = opacity 0.95 0.85, class:^(Rhythmbox)$

# Communication (non-browsers) - Enable blur
windowrulev2 = opacity 0.95 0.85, class:^(discord)$
windowrulev2 = opacity 0.95 0.85, class:^(Signal)$
windowrulev2 = opacity 0.95 0.85, class:^(Telegram)$
windowrulev2 = opacity 0.95 0.85, class:^(Slack)$

# Xwaylandvideobridge (if installed)
windowrule = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrule = noanim, class:^(xwaylandvideobridge)$
windowrule = noinitialfocus, class:^(xwaylandvideobridge)$
windowrule = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrule = noblur, class:^(xwaylandvideobridge)$

# Dialogs
windowrule = float, title:^(Open File)(.*)$
windowrule = float, title:^(Select a File)(.*)$
windowrule = float, title:^(Choose wallpaper)(.*)$
windowrule = float, title:^(Open Folder)(.*)$
windowrule = float, title:^(Save As)(.*)$
windowrule = float, title:^(Library)(.*)$
windowrule = float, title:^(File Upload)(.*)$

# Tearing
windowrule = immediate, class:.*\.exe
windowrule = immediate, class:(steam_app)455

# ######## Layer rules ########
# layerrule = xray 1, .*
# layerrule = noanim, .*
layerrule = noanim, selection
layerrule = noanim, popup.*
layerrule = noanim, hyprpicker
layerrule = noanim, noanim
layerrule = noanim, wallpapers

# Blur for transparent overlays
layerrule = blur, gtk-layer-shell
layerrule = ignorealpha 0.3, gtk-layer-shell

# Blur for waybar (bar)
layerrule = blur, hypryou-bar
layerrule = ignorealpha 0.3, hypryou-bar

